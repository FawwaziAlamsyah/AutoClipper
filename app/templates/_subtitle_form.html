<div class="panel card shadow-sm p-4 mt-3">
  <div class="d-flex align-items-center gap-2 mb-3">
    <i class="bi bi-chat-square-text text-danger fs-5"></i>
    <h5 class="mb-0">{{ t("candDetail.subtitle") }}</h5>
  </div>
  <form class="row g-2 align-items-end" 
        hx-post="/subtitle/clips/{{ clip_id }}" 
        hx-target="#subtitleResult" 
        hx-swap="innerHTML">
    <div class="col-auto"><label class="form-label">{{ t("candDetail.format") }}</label><select class="form-select form-select-sm" name="format"><option value="srt">{{ t("candDetail.srt") }}</option><option value="vtt">{{ t("candDetail.vtt") }}</option></select></div>
    <div class="col-auto"><label class="form-label">{{ t("candDetail.style") }}</label><select class="form-select form-select-sm" name="style"><option value="minimal">{{ t("candDetail.minimal") }}</option><option value="tiktok">{{ t("candDetail.tiktok") }}</option><option value="youtube">{{ t("candDetail.youtube") }}</option></select></div>
    <div class="col-auto"><label class="form-label">{{ t("candDetail.langLabel") }}</label><select class="form-select form-select-sm" name="language"><option value="id">{{ t("upload.indonesia") }}</option><option value="en">{{ t("upload.english") }}</option></select></div>
    <div class="col-auto"><button class="btn btn-primary btn-sm" type="submit">{{ t("candDetail.genSub") }}</button></div>
  </form>
  <div id="subtitleResult" class="mt-3"></div>
</div>
