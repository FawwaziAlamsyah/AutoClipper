<div class="card shadow-sm p-4 mt-3">
  <h5>Subtitle</h5>
  <form class="row g-2 align-items-end" 
        hx-post="/subtitle/clips/{{ clip_id }}" 
        hx-target="#subtitleResult" 
        hx-swap="innerHTML">
    <div class="col-auto"><label class="form-label">Format</label><select class="form-select" name="format"><option value="srt">SRT</option><option value="vtt">VTT</option></select></div>
    <div class="col-auto"><label class="form-label">Style</label><select class="form-select" name="style"><option value="minimal">Minimal</option><option value="tiktok">TikTok</option><option value="youtube">YouTube</option></select></div>
    <div class="col-auto"><label class="form-label">Bahasa</label><select class="form-select" name="language"><option value="id">Indonesia</option><option value="en">English</option></select></div>
    <div class="col-auto"><button class="btn btn-dark" type="submit">Generate Subtitle</button></div>
  </form>
  <div id="subtitleResult" class="mt-3"></div>
</div>
