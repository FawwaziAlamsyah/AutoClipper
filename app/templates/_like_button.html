{% if candidate.label_source == "user_liked" %}
<span class="badge bg-success fs-6">✓ Liked (training bagus)</span>
<button class="btn btn-sm btn-outline-secondary"
        onclick="doLikeAction('/candidates/{{ candidate.id }}/unlike')">
  Batalkan
</button>
{% elif candidate.label_source == "user_disliked" %}
<span class="badge bg-danger fs-6">✗ Ditandai Jelek (training)</span>
<button class="btn btn-sm btn-outline-secondary"
        onclick="doLikeAction('/candidates/{{ candidate.id }}/undislike')">
  Batalkan
</button>
{% else %}
<button type="button" class="btn btn-outline-success" data-bs-toggle="modal" data-bs-target="#likeConfirmModal">
  👍 Like (contoh bagus)
</button>
<button type="button" class="btn btn-outline-danger" data-bs-toggle="modal" data-bs-target="#dislikeConfirmModal">
  👎 Tandai Jelek (contoh buruk)
</button>
{% endif %}
