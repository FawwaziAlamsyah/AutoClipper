<div id="clip-edit-preview">
  {% set raw_path = clip.edited_file_path or clip.file_path %}
  {% set preview_path = raw_path.replace('\\', '/').split('data/outputs/')[-1] %}
  <div class="thumb">
    <video class="w-100 h-100 rounded clip-player-video" controls preload="metadata">
      <source src="/data/outputs/{{ preview_path }}?v={{ cachebust(raw_path) }}" type="video/mp4">
    </video>
  </div>
  {% if clip.edited_file_path %}
  <span class="badge bg-warning text-dark mt-2"><i class="bi bi-pencil-fill me-1"></i>{{ t("widget.edited") }}</span>
  {% endif %}
</div>
