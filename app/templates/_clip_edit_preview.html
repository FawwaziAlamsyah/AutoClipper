<div id="clip-edit-preview">
  {% set raw_path = clip.edited_file_path or clip.file_path %}
  {% set preview_path = raw_path.replace('\\', '/').split('data/outputs/')[-1] %}
  <video class="w-100 rounded" controls preload="metadata" style="max-height: 500px;">
    <source src="/data/outputs/{{ preview_path }}?t={{ ts }}" type="video/mp4">
  </video>
  {% if clip.edited_file_path %}
  <span class="badge bg-warning text-dark mt-2">Sudah diedit</span>
  {% endif %}
</div>
