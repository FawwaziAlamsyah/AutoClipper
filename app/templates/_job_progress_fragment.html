<div class="progress mt-3" style="height: 25px;">
  <div class="progress-bar progress-bar-striped {% if status.status in ('pending', 'running') %}progress-bar-animated{% endif %}" role="progressbar"
       style="width: {{ status.progress_percent }}%">{{ status.progress_percent }}%</div>
</div>
<div class="mt-2">
  <small class="text-muted">{{ status.completed_steps }} / {{ status.total_steps }} step selesai</small>
  {% if status.current_step %}<span class="badge bg-info ms-2">Step aktif: {{ status.current_step }}</span>{% endif %}
  <span class="badge bg-{{ 'success' if status.status == 'completed' else ('danger' if status.status in ('failed', 'cancelled') else 'warning') }} ms-2">{{ status.status }}</span>
</div>
