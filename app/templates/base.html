<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.4"
          integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48W4bwqsCPXTNsFVaHz3XKz7RnCn5"
          crossorigin="anonymous"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand"
         href="/"
         hx-get="/"
         hx-target="#main-content"
         hx-push-url="true">{{ app_name }}</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item">
            <a class="nav-link" href="/"
               hx-get="/"
               hx-target="#main-content"
               hx-push-url="true">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/upload"
               hx-get="/upload"
               hx-target="#main-content"
               hx-push-url="true">Upload</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/candidates"
               hx-get="/candidates"
               hx-target="#main-content"
               hx-push-url="true">Candidates</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/history"
               hx-get="/history"
               hx-target="#main-content"
               hx-push-url="true">History</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/training/dashboard"
               hx-get="/training/dashboard"
               hx-target="#main-content"
               hx-push-url="true">Training</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/storage/dashboard"
               hx-get="/storage/dashboard"
               hx-target="#main-content"
               hx-push-url="true">Storage</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Area widget global (job progress dll) — polling otomatis via htmx
       TIDAK PERNAH ikut di-swap saat navigasi karena di luar #main-content. -->
  <div id="global-widgets"
       hx-get="/jobs/active/status-widget"
       hx-trigger="load, every 3s"
       hx-swap="outerHTML"></div>

  <div id="main-content" class="container py-4">
    {% block content %}
      {% if _content_partial is defined %}
        {% include _content_partial %}
      {% endif %}
    {% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
